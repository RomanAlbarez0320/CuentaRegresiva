<!-- ===== MÚSICA DE FONDO (AUTOPLAY, SIN CONTROLES) ===== -->
    <audio id="musicaFondo" loop>
        <source src="Phillip Phillips - Gone, Gone, Gone.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
    </audio>

    <script>
        // ===== ACTIVACIÓN AUTOMÁTICA DE MÚSICA =====
        (function() {
            const audio = document.getElementById('musicaFondo');
            // Volumen al máximo
            audio.volume = 1.0;

            // Intentar reproducir automáticamente
            audio.play().catch(() => {
                // Si falla, esperar el primer clic en cualquier parte
                const activar = () => {
                    audio.play();
                    document.removeEventListener('click', activar);
                    document.removeEventListener('touchstart', activar);
                };
                document.addEventListener('click', activar);
                document.addEventListener('touchstart', activar);
            });
        })();
    </script>
